name: freqhub-stack

services:
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: freqhub-backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_PATH=/app/data/freqhub.db
    volumes:
      - ./backend/data:/app/data
      - ./examples/docker/freqtrade-data-1:/freqtrade/configs/bot1
      - ./examples/docker/freqtrade-data-2:/freqtrade/configs/bot2
      - ./examples/docker/freqtrade-data-3:/freqtrade/configs/bot3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: freqhub-frontend
    ports:
      - "3000:80"
    environment:
      - BASE_PATH=${BASE_PATH:-/}
    volumes:
      - ./docker/nginx.conf.docker-compose:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      - backend

