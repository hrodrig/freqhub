services:
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: freqhub-backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/freqhub.db
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-change-this-encryption-key-in-production}
      - CORS_ORIGIN=http://localhost:3000
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: freqhub-frontend
    ports:
      - "3000:80"
    environment:
      - BASE_PATH=${BASE_PATH:-/}
    # Note: nginx.conf defaults to localhost:3001 for local development
    # For Docker Compose with backend service, you may need to create a custom nginx.conf
    restart: unless-stopped
    depends_on:
      - backend

