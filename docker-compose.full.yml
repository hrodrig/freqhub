services:
  # Valkey Cache (Redis-compatible)
  valkey:
    image: valkey/valkey:7.2
    container_name: freqhub-valkey
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - ./backend/data:/data
    command: valkey-server --appendonly yes
    networks:
      - freqhub-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # FreqHub Backend
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: freqhub-backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_PATH=/app/data/freqhub.db
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-change-this-encryption-key-min-32-characters-long}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Valkey Cache Configuration
      - VALKEY_ENABLED=${VALKEY_ENABLED:-true}
      - VALKEY_HOST=valkey
      - VALKEY_PORT=6379
      - VALKEY_PASSWORD=${VALKEY_PASSWORD:-}
    volumes:
      - ./backend/data:/app/data
    networks:
      - freqhub-network
    restart: unless-stopped
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # FreqHub Frontend
  frontend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.frontend
      args:
        - VITE_BASE_PATH=${BASE_PATH:-/}
        # VITE_API_PROXY_TARGET is optional - if not set, will use relative URL (Nginx will proxy)
        # Only set if you need a custom backend URL
        - VITE_API_PROXY_TARGET=${VITE_API_PROXY_TARGET:-}
    container_name: freqhub-frontend
    ports:
      - "3000:80"
    environment:
      - BASE_PATH=${BASE_PATH:-/}
    networks:
      - freqhub-network
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  # Freqtrade Instance 1
  freqtrade-1:
    image: freqtradeorg/freqtrade:stable
    container_name: freqtrade-1
    volumes:
      - ./examples/docker/freqtrade-data-1:/freqtrade/user_data
    ports:
      - "8080:8080"
    environment:
      - FREQTRADE__API_SERVER__ENABLED=true
      - FREQTRADE__API_SERVER__LISTEN_IP_ADDRESS=0.0.0.0
      - FREQTRADE__API_SERVER__LISTEN_PORT=8080
      - FREQTRADE__API_SERVER__USERNAME=${FREQTRADE_USERNAME:-freqtrader}
      - FREQTRADE__API_SERVER__PASSWORD=${FREQTRADE_PASSWORD_1:-SuperSecret1!}
      - FREQTRADE__API_SERVER__JWT_SECRET_KEY=${FREQTRADE_JWT_SECRET:-change-this-jwt-secret-key-in-production}
      - FREQTRADE__API_SERVER__CORS_ORIGINS=["http://localhost:3000","http://localhost:3001"]
      - FREQTRADE__DRY_RUN=true
      - FREQTRADE__DRY_RUN_WALLET=1000
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite
      --config /freqtrade/user_data/config.json
      --strategy SampleStrategy
    networks:
      - freqhub-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/v1/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Freqtrade Instance 2 (for multi-bot testing)
  freqtrade-2:
    image: freqtradeorg/freqtrade:stable
    container_name: freqtrade-2
    volumes:
      - ./examples/docker/freqtrade-data-2:/freqtrade/user_data
    ports:
      - "8081:8080"
    environment:
      - FREQTRADE__API_SERVER__ENABLED=true
      - FREQTRADE__API_SERVER__LISTEN_IP_ADDRESS=0.0.0.0
      - FREQTRADE__API_SERVER__LISTEN_PORT=8080
      - FREQTRADE__API_SERVER__USERNAME=${FREQTRADE_USERNAME:-freqtrader}
      - FREQTRADE__API_SERVER__PASSWORD=${FREQTRADE_PASSWORD_2:-SuperSecret2!}
      - FREQTRADE__API_SERVER__JWT_SECRET_KEY=${FREQTRADE_JWT_SECRET:-change-this-jwt-secret-key-in-production}
      - FREQTRADE__API_SERVER__CORS_ORIGINS=["http://localhost:3000","http://localhost:3001"]
      - FREQTRADE__DRY_RUN=true
      - FREQTRADE__DRY_RUN_WALLET=1000
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite
      --config /freqtrade/user_data/config.json
      --strategy SampleStrategy
    networks:
      - freqhub-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/v1/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Freqtrade Instance 3 (disabled in example DB, but available for testing)
  freqtrade-3:
    image: freqtradeorg/freqtrade:stable
    container_name: freqtrade-3
    volumes:
      - ./examples/docker/freqtrade-data-3:/freqtrade/user_data
    ports:
      - "8082:8080"
    environment:
      - FREQTRADE__API_SERVER__ENABLED=true
      - FREQTRADE__API_SERVER__LISTEN_IP_ADDRESS=0.0.0.0
      - FREQTRADE__API_SERVER__LISTEN_PORT=8080
      - FREQTRADE__API_SERVER__USERNAME=${FREQTRADE_USERNAME:-freqtrader}
      - FREQTRADE__API_SERVER__PASSWORD=${FREQTRADE_PASSWORD_3:-SuperSecret3!}
      - FREQTRADE__API_SERVER__JWT_SECRET_KEY=${FREQTRADE_JWT_SECRET:-change-this-jwt-secret-key-in-production}
      - FREQTRADE__API_SERVER__CORS_ORIGINS=["http://localhost:3000","http://localhost:3001"]
      - FREQTRADE__DRY_RUN=true
      - FREQTRADE__DRY_RUN_WALLET=1000
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite
      --config /freqtrade/user_data/config.json
      --strategy SampleStrategy
    networks:
      - freqhub-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/v1/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  freqhub-network:
    driver: bridge

