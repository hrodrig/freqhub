# ⚠️ IMPORTANT
# This is an example NetworkPolicy to reduce SSRF blast radius by restricting backend egress.
# You MUST adapt selectors/ports to match your cluster and your Freqtrade deployments.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: freqhub-backend-egress
  namespace: main
  labels:
    app: freqhub
    component: backend
spec:
  podSelector:
    matchLabels:
      app: freqhub
      component: backend
  policyTypes:
    - Egress
  egress:
    # Allow DNS (needed to resolve service names)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # Allow Valkey (FreqHub cache/event bus)
    - to:
        - podSelector:
            matchLabels:
              app: freqhub
              component: valkey
      ports:
        - protocol: TCP
          port: 6379

    # Allow Freqtrade bot APIs (ADAPT labels/ports to your setup)
    # Example: label your Freqtrade pods/services with app=freqtrade and expose API on 8080.
    - to:
        - podSelector:
            matchLabels:
              app: freqtrade
      ports:
        - protocol: TCP
          port: 8080
