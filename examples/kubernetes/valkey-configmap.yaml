apiVersion: v1
kind: ConfigMap
metadata:
  name: freqhub-valkey-config
  namespace: main
  labels:
    app: freqhub
    component: valkey
data:
  valkey.conf: |
    # Valkey configuration file
    # Generated for FreqHub deployment
    
    # Network
    bind 0.0.0.0
    port 6379
    protected-mode no
    
    # Persistence
    appendonly yes
    appendfsync everysec
    dir /data
    
    # Memory management
    maxmemory 256mb
    maxmemory-policy allkeys-lru
    
    # Logging
    loglevel notice
    
    # Performance
    save ""
    stop-writes-on-bgsave-error no
    
    # Security (optional - uncomment if needed)
    # requirepass your-password-here
