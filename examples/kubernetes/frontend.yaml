---
apiVersion: v1
kind: ConfigMap
metadata:
  name: freqhub-frontend-config
  namespace: main
  labels:
    app: freqhub
    component: frontend
data:
  BASE_PATH: "/"
---
apiVersion: v1
kind: Service
metadata:
  name: freqhub-frontend
  namespace: main
  labels:
    app: freqhub
    component: frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: freqhub
    component: frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: freqhub-frontend
  namespace: main
  labels:
    app: freqhub
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: freqhub
      component: frontend
  template:
    metadata:
      labels:
        app: freqhub
        component: frontend
    spec:
      containers:
        - name: frontend
          # Use published image from registry
          # Update this to match your registry and image tag
          # Example: hcr.hermesrodriguez.com/freqhub/freqhub-frontend:dev-latest
          image: hcr.hermesrodriguez.com/freqhub/freqhub-frontend:dev-latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          envFrom:
            - configMapRef:
                name: freqhub-frontend-config
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          # livenessProbe:
          #   httpGet:
          #     path: /
          #     port: 80
          #   initialDelaySeconds: 10
          #   periodSeconds: 30
          # readinessProbe:
          #   httpGet:
          #     path: /
          #     port: 80
          #   initialDelaySeconds: 5
          #   periodSeconds: 10
      imagePullSecrets:
      - name: registry-credentials
      volumes:
        - name: tmp-volume
          emptyDir:
            sizeLimit: 16Gi
        - name: nginx-config
          configMap:
            name: freqhub-frontend-nginx-config
      restartPolicy: Always