---
apiVersion: v1
kind: ConfigMap
metadata:
  name: freqhub-backend-config
  namespace: main
  labels:
    app: freqhub
    component: backend
data:
  PORT: "3001"
  NODE_ENV: "production"
  DATABASE_PATH: "/app/data/freqhub.db"
  CORS_ORIGIN: "http://localhost:3000"
  LOG_LEVEL: "info"
  VALKEY_ENABLED: "true"
  VALKEY_HOST: "freqhub-valkey"
  VALKEY_PORT: "6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: freqhub-backend-secrets
  namespace: main
  labels:
    app: freqhub
    component: backend
type: Opaque
stringData:
  # Change these values in production
  ENCRYPTION_KEY: "change-this-encryption-key-min-32-characters-long-in-production"
  # VALKEY_PASSWORD: ""  # Optional, if Valkey has a password
---
apiVersion: v1
kind: Service
metadata:
  name: freqhub-backend
  namespace: main
  labels:
    app: freqhub
    component: backend
spec:
  type: ClusterIP
  ports:
    - port: 3001
      targetPort: 3001
      protocol: TCP
      name: http
  selector:
    app: freqhub
    component: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: freqhub-backend
  namespace: main
  labels:
    app: freqhub
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: freqhub
      component: backend
  template:
    metadata:
      labels:
        app: freqhub
        component: backend
    spec:
      containers:
        - name: backend
          # Use published image from Docker Hub
          # For development, you can build locally and use a different image
          image: freqhub/freqhub-backend:latest
          ports:
            - containerPort: 3001
              name: http
          envFrom:
            - configMapRef:
                name: freqhub-backend-config
            - secretRef:
                name: freqhub-backend-secrets
          volumeMounts:
            - name: backend-data
              mountPath: /app/data
            - name: tmp-volume
              mountPath: /tmp
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 3001
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - freqhub
                    - key: component
                      operator: In
                      values:
                        - valkey
                topologyKey: kubernetes.io/hostname
      volumes:
        - name: backend-data
          persistentVolumeClaim:
            claimName: freqhub-backend-pvc
        - name: tmp-volume
          emptyDir:
            sizeLimit: 16Gi