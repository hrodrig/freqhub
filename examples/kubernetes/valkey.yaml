---
apiVersion: v1
kind: Service
metadata:
  name: freqhub-valkey
  namespace: main
  labels:
    app: freqhub
    component: valkey
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    app: freqhub
    component: valkey
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: freqhub-valkey
  namespace: main
  labels:
    app: freqhub
    component: valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app: freqhub
      component: valkey
  template:
    metadata:
      labels:
        app: freqhub
        component: valkey
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:7.2
          ports:
            - containerPort: 6379
              name: redis
          command:
            - valkey-server
            - /etc/valkey/valkey.conf
          volumeMounts:
            - name: valkey-config
              mountPath: /etc/valkey
              readOnly: true
            - name: valkey-data
              mountPath: /data
            - name: tmp-volume
              mountPath: /tmp
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            exec:
              command:
                - valkey-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - valkey-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: valkey-config
          configMap:
            name: freqhub-valkey-config
        - name: valkey-data
          persistentVolumeClaim:
            claimName: freqhub-valkey-pvc
        - name: tmp-volume
          emptyDir:
            sizeLimit: 16Gi
      # For development/testing without persistence, use emptyDir:
      # volumes:
      #   - name: valkey-data
      #     emptyDir: {}