# Docker Compose example using published Docker images
# This example uses pre-built images from a Docker registry instead of building locally
#
# To use this file:
# 1. Configure your registry in .docker-publish-config (see .docker-publish-config.example)
# 2. Publish images using: ./scripts/publish-docker-images.sh [version] [--latest]
# 3. Update the IMAGE_REGISTRY, IMAGE_USERNAME, and IMAGE_VERSION variables below
# 4. Run: docker-compose up -d
#
# Example:
#   export IMAGE_REGISTRY=docker.io
#   export IMAGE_USERNAME=your-username
#   export IMAGE_VERSION=v0.2.0
#   docker-compose up -d

services:
  # Valkey Cache (Redis-compatible) - Optional but recommended for FreqHub
  valkey:
    image: valkey/valkey:7.2
    container_name: freqtrade-valkey
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - ./valkey-data:/data
    command: valkey-server --appendonly yes
    networks:
      - freqtrade-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # FreqHub Backend (using published image)
  freqhub-backend:
    image: ${IMAGE_REGISTRY:-docker.io}/${IMAGE_USERNAME:-freqhub}/freqhub-backend:${IMAGE_VERSION:-latest}
    container_name: freqhub-backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/freqhub.db
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-change-this-encryption-key-in-production}
      - CORS_ORIGIN=http://localhost:3000
      # Valkey Cache Configuration
      - VALKEY_ENABLED=${VALKEY_ENABLED:-true}
      - VALKEY_HOST=valkey
      - VALKEY_PORT=6379
      - VALKEY_PASSWORD=${VALKEY_PASSWORD:-}
    volumes:
      - ./freqhub-data:/app/data
    networks:
      - freqtrade-network
    restart: unless-stopped
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3001/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # FreqHub Frontend (using published image)
  freqhub-frontend:
    image: ${IMAGE_REGISTRY:-docker.io}/${IMAGE_USERNAME:-freqhub}/freqhub-frontend:${IMAGE_VERSION:-latest}
    container_name: freqhub-frontend
    ports:
      - "3000:80"
    environment:
      - BASE_PATH=${BASE_PATH:-/}
    volumes:
      - ../../docker/nginx.conf.docker-compose:/etc/nginx/conf.d/default.conf:ro
    networks:
      - freqtrade-network
    restart: unless-stopped
    depends_on:
      - freqhub-backend

  # Freqtrade Bot Instance 1
  freqtrade-bot-1:
    image: freqtradeorg/freqtrade:stable
    container_name: freqtrade-bot-1
    restart: unless-stopped
    volumes:
      - ./freqtrade-data-1:/freqtrade/user_data
    ports:
      - "8080:8080"  # API port
    environment:
      # API Server Configuration
      - FREQTRADE__API_SERVER__ENABLED=true
      - FREQTRADE__API_SERVER__LISTEN_IP_ADDRESS=0.0.0.0
      - FREQTRADE__API_SERVER__LISTEN_PORT=8080
      - FREQTRADE__API_SERVER__USERNAME=${FREQTRADE_USERNAME:-freqtrader}
      - FREQTRADE__API_SERVER__PASSWORD=${FREQTRADE_PASSWORD_1:-SuperSecret1!}
      - FREQTRADE__API_SERVER__JWT_SECRET_KEY=${FREQTRADE_JWT_SECRET:-change-this-jwt-secret-key-in-production}
      - FREQTRADE__API_SERVER__CORS_ORIGINS=["http://localhost:3000","http://localhost:3001"]
      # Exchange Configuration (Binance)
      - FREQTRADE__EXCHANGE__NAME=${FREQTRADE_EXCHANGE_NAME:-binance}
      - FREQTRADE__EXCHANGE__KEY=${FREQTRADE_EXCHANGE_KEY_1:-}
      - FREQTRADE__EXCHANGE__SECRET=${FREQTRADE_EXCHANGE_SECRET_1:-}
      # Trading Configuration
      - FREQTRADE__DRY_RUN=${FREQTRADE_DRY_RUN:-true}
      - FREQTRADE__DRY_RUN_WALLET=${FREQTRADE_DRY_RUN_WALLET:-1000}
      - FREQTRADE__STRATEGY=${FREQTRADE_STRATEGY_1:-SampleStrategy}
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite
      --config /freqtrade/user_data/config.json
      --strategy ${FREQTRADE_STRATEGY_1:-SampleStrategy}
    networks:
      - freqtrade-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/api/v1/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Freqtrade Bot Instance 2
  freqtrade-bot-2:
    image: freqtradeorg/freqtrade:stable
    container_name: freqtrade-bot-2
    restart: unless-stopped
    volumes:
      - ./freqtrade-data-2:/freqtrade/user_data
    ports:
      - "8081:8080"  # Different port for second instance
    environment:
      # API Server Configuration
      - FREQTRADE__API_SERVER__ENABLED=true
      - FREQTRADE__API_SERVER__LISTEN_IP_ADDRESS=0.0.0.0
      - FREQTRADE__API_SERVER__LISTEN_PORT=8080
      - FREQTRADE__API_SERVER__USERNAME=${FREQTRADE_USERNAME:-freqtrader}
      - FREQTRADE__API_SERVER__PASSWORD=${FREQTRADE_PASSWORD_2:-SuperSecret2!}
      - FREQTRADE__API_SERVER__JWT_SECRET_KEY=${FREQTRADE_JWT_SECRET:-change-this-jwt-secret-key-in-production}
      - FREQTRADE__API_SERVER__CORS_ORIGINS=["http://localhost:3000","http://localhost:3001"]
      # Exchange Configuration (Binance)
      - FREQTRADE__EXCHANGE__NAME=${FREQTRADE_EXCHANGE_NAME:-binance}
      - FREQTRADE__EXCHANGE__KEY=${FREQTRADE_EXCHANGE_KEY_2:-}
      - FREQTRADE__EXCHANGE__SECRET=${FREQTRADE_EXCHANGE_SECRET_2:-}
      # Trading Configuration
      - FREQTRADE__DRY_RUN=${FREQTRADE_DRY_RUN:-true}
      - FREQTRADE__DRY_RUN_WALLET=${FREQTRADE_DRY_RUN_WALLET:-1000}
      - FREQTRADE__STRATEGY=${FREQTRADE_STRATEGY_2:-SampleStrategy}
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite
      --config /freqtrade/user_data/config.json
      --strategy ${FREQTRADE_STRATEGY_2:-SampleStrategy}
    networks:
      - freqtrade-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/api/v1/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Freqtrade Bot Instance 3 (disabled in example DB, but available for testing)
  freqtrade-bot-3:
    image: freqtradeorg/freqtrade:stable
    container_name: freqtrade-bot-3
    restart: unless-stopped
    volumes:
      - ./freqtrade-data-3:/freqtrade/user_data
    ports:
      - "8082:8080"  # Different port for third instance
    environment:
      # API Server Configuration
      - FREQTRADE__API_SERVER__ENABLED=true
      - FREQTRADE__API_SERVER__LISTEN_IP_ADDRESS=0.0.0.0
      - FREQTRADE__API_SERVER__LISTEN_PORT=8080
      - FREQTRADE__API_SERVER__USERNAME=${FREQTRADE_USERNAME:-freqtrader}
      - FREQTRADE__API_SERVER__PASSWORD=${FREQTRADE_PASSWORD_3:-SuperSecret3!}
      - FREQTRADE__API_SERVER__JWT_SECRET_KEY=${FREQTRADE_JWT_SECRET:-change-this-jwt-secret-key-in-production}
      - FREQTRADE__API_SERVER__CORS_ORIGINS=["http://localhost:3000","http://localhost:3001"]
      # Exchange Configuration (Binance)
      - FREQTRADE__EXCHANGE__NAME=${FREQTRADE_EXCHANGE_NAME:-binance}
      - FREQTRADE__EXCHANGE__KEY=${FREQTRADE_EXCHANGE_KEY_3:-}
      - FREQTRADE__EXCHANGE__SECRET=${FREQTRADE_EXCHANGE_SECRET_3:-}
      # Trading Configuration
      - FREQTRADE__DRY_RUN=${FREQTRADE_DRY_RUN:-true}
      - FREQTRADE__DRY_RUN_WALLET=${FREQTRADE_DRY_RUN_WALLET:-1000}
      - FREQTRADE__STRATEGY=${FREQTRADE_STRATEGY_3:-SampleStrategy}
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite
      --config /freqtrade/user_data/config.json
      --strategy ${FREQTRADE_STRATEGY_3:-SampleStrategy}
    networks:
      - freqtrade-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/api/v1/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  freqtrade-network:
    driver: bridge
